<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Регистрация — Helper</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body class="auth-page">
    <main class="auth-card">
        <div class="brand-mark">H</div>
        <h1>Регистрация</h1>
        <p class="muted">Создайте учетную запись для просмотра базы</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <form method="post" class="form">
            <label for="username">Логин</label>
            <input id="username" name="username" type="text" minlength="3" autocomplete="username" required autofocus>
            <label for="password">Пароль</label>
            <input id="password" name="password" type="password" minlength="6" autocomplete="new-password" required>
            <label for="password_confirmation">Повторите пароль</label>
            <input id="password_confirmation" name="password_confirmation" type="password" minlength="6" autocomplete="new-password" required>
            <button class="button primary full-width" type="submit">Зарегистрироваться</button>
        </form>
        <p class="auth-switch">Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p>
    </main>
</body>
</html>
